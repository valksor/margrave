name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly scan to catch advisories in code that hasn't changed.
    - cron: "21 4 * * 1"

# Collapse redundant runs on the same ref, but never abort an in-progress scan
# (a partial SARIF upload is worse than a duplicate).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      # Independent legs: a failure in one must not suppress the other SARIF upload.
      fail-fast: false
      matrix:
        language:
          # No compilation needed for either: build-mode none below.
          - javascript-typescript
          # The workflows and the setup-build composite action.
          - actions

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: "/language:${{ matrix.language }}"
