name: Publish container

on:
  workflow_run:
    workflows: [Build and Release]
    types: [completed]

permissions: {}

concurrency:
  group: container-release
  queue: max

jobs:
  publish-container:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/build.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download Linux bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-linux-*
          path: ${{ runner.temp }}/margrave-bundles
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download bumped package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bumped-package
          path: ${{ runner.temp }}/margrave-version
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          version=$(jq -er '.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$RUNNER_TEMP/margrave-version/package.json")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Prepare build context
        id: context
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/margrave-container-context"
          mkdir -p "$context"
          cp Dockerfile "$context/Dockerfile"
          cp "$RUNNER_TEMP/margrave-bundles/bundle-linux-x64/margrave-v${VERSION}-linux-x64.tar.gz" "$context/margrave-amd64.tar.gz"
          cp "$RUNNER_TEMP/margrave-bundles/bundle-linux-arm64/margrave-v${VERSION}-linux-arm64.tar.gz" "$context/margrave-arm64.tar.gz"
          echo "path=$context" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Debian sources
        id: sources
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ steps.context.outputs.path }}
          target: debian-sources
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.context.outputs.image }}:v${{ steps.version.outputs.version }}-debian-sources
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish runtime
        id: runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ steps.context.outputs.path }}
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.context.outputs.image }}:v${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.github.valksor.margrave.debian-sources=${{ steps.context.outputs.image }}@${{ steps.sources.outputs.digest }}

      - name: Verify published images and update latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.context.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_DIGEST: ${{ steps.sources.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          for entry in "v${VERSION}-debian-sources=$SOURCE_DIGEST" "v${VERSION}=$RUNTIME_DIGEST"; do
            tag=${entry%%=*}
            digest=${entry#*=}
            test "$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')" = "$digest"
            docker buildx imagetools inspect "$IMAGE:$tag" --raw | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]' > /dev/null
          done
          branch_version=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPOSITORY/contents/package.json?ref=$REF_NAME" | jq -er .version)
          if [[ "$branch_version" == "$VERSION" ]]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$RUNTIME_DIGEST"
            test "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')" = "$RUNTIME_DIGEST"
            docker buildx imagetools inspect "$IMAGE:latest" --raw | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]' > /dev/null
          else
            echo "Branch version $branch_version differs from $VERSION; leaving latest unchanged."
          fi
