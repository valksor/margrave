name: Setup Build Environment
description: Repeated setup shared by the test, bundle, and release jobs. Activates pnpm (pinned by the packageManager field), sets up Node (the node-version input, else the version in .nvmrc) with a pnpm cache, optionally pulls the bumped package.json artifact, and installs dependencies.

inputs:
  download-bumped:
    description: When 'true', download the bumped-package artifact uploaded by the version-bump job before installing.
    required: false
    default: "false"
  install:
    description: When 'true' (default), run `pnpm install --frozen-lockfile`. Set 'false' for jobs that want to install differently.
    required: false
    default: "true"
  node-version:
    description: Node version for actions/setup-node. When empty (default), the version in .nvmrc is used.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: "pnpm"

    - if: inputs.download-bumped == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bumped-package
        path: .

    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
