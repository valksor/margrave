# c8 -> test-exclude@8 pins glob ^13 and minimatch ^10. Both have advisories
# fixed only in the next major (glob >=14.0.2, minimatch >=11.0.1). Exact
# pins: minimatch 11.0.9 is newer than the 3-day cooldown in dependabot.yml.
# Remove these when test-exclude depends on the fixed majors.
overrides:
  glob: "14.0.6"
  minimatch: "11.0.8"
allowBuilds:
  # lefthook's only build script is a convenience that auto-runs `lefthook install`;
  # our `prepare` script does that explicitly, so no lifecycle script is needed here.
  lefthook: false
  # esbuild's platform binary comes from optionalDependencies, so the postinstall is not needed.
  esbuild: false
