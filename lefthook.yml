# Pre-commit hooks. Runs on STAGED files only and keeps fast; the full test
# suite stays in CI. Sequential (parallel: false) so oxlint --fix and
# prettier --write never race to write the same file. .oxlintrc.json enables
# no formatting rules, so the two never fight over formatting.
pre-commit:
  parallel: false
  commands:
    oxlint:
      glob: "*.{ts,mts,cts,mjs}"
      run: pnpm exec oxlint --type-aware --fix --no-error-on-unmatched-pattern -- {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{ts,mts,cts,mjs,json,md,yml,yaml}"
      run: pnpm exec prettier --write -- {staged_files}
      stage_fixed: true
